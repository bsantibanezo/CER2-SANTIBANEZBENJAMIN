{% extends 'core/base.html' %}

{% block title %}{{ titulo }} · Patrimonio Vivo{% endblock %}

{% block content %}
    <div class="login-caja">
        <h1 class="mb-4">{{ titulo }}</h1>

        <form method="post">
            {% csrf_token %}
            {% for campo in form %}
                <div class="mb-3">
                    {{ campo.label_tag }}
                    {{ campo }}
                    {% for error in campo.errors %}
                        <div class="text-danger small">{{ error }}</div>
                    {% endfor %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-dark">Guardar</button>
            <a href="{% url 'gestion' %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
{% endblock %}
