{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Patrimonio Vivo{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/estilos.css' %}">
</head>
<body>

    <nav class="navbar md:navbar-expand bg-1" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'inicio' %}">Patrimonio Vivo</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                    data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                    aria-expanded="false" aria-label="Mostrar menú">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="menuPrincipal"
                    aria-labelledby="menuPrincipalLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="menuPrincipalLabel">Menú</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer"
                            aria-label="Cerrar"></button>
                </div>
                <div class="drawer-body">
                    <ul class="nav navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'inicio' %}">Inicio</a>
                        </li>
                    </ul>
                </div>
            </dialog>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center fg-2 py-3 border-top">
        Fundación Patrimonio Vivo · Certamen N°2
    </footer>

    <script type="module" src="{% static 'core/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
